[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pointsnap"
version = "0.1.0"
description = "Model-agnostic post-hoc fly-point correction for monocular depth geometry"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "opencv-python>=4.9",
    "pyyaml>=6.0",
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=4.45",
    "huggingface_hub>=0.24",
    "matplotlib>=3.8",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "pillow>=10.0",
    "trimesh>=4.0",
    "pandas>=2.2",
    "tqdm>=4.66",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
